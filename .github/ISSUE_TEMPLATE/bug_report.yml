name: 插件问题记录
description: 按统一格式记录 AI Command Engine 的插件问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        本仓库的问题记录公开可见。请只提供复现问题所需的内容，去掉密钥、令牌及不希望公开的工程资料。
        一个问题提交一条记录；无法确认的版本请填写“未知”，不要推测。
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      placeholder: 例如 0.10.87
    validations:
      required: true
  - type: input
    id: eda_version
    attributes:
      label: EDA 版本
      placeholder: 嘉立创 EDA 专业版版本号；无法确认请填“未知”
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从什么状态开始，执行了哪些操作，在哪一步出现问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 区分实际观察到的现象与推测原因。
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 相关指令
      description: 可选。附能复现问题的指令和参数，替换私有工程名称、路径或标识。
  - type: textarea
    id: evidence
    attributes:
      label: 必要证据
      description: 可选。粘贴脱敏错误片段，或附经你确认可以公开的截图。
